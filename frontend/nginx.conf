server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /classes { proxy_pass http://backend:8080; }
    location /holds { proxy_pass http://backend:8080; }
    location /admin { proxy_pass http://backend:8080; }
    location /me/ { proxy_pass http://backend:8080; }
    location /applications { proxy_pass http://backend:8080; }
    location = /health { proxy_pass http://backend:8080/health; }
    location /swagger { proxy_pass http://backend:8080; }

    location / { try_files $uri $uri/ /index.html; }
}
